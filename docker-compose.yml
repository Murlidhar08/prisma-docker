services:
  # 1. Database Service (PostgreSQL)
  database:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file: .env.pod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:${POSTGRES_PORT}"
    networks:
      - next-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Migration Service (Prisma)
  migration:
    build:
      context: .
      target: builder
    container_name: migration_service
    command: npx prisma migrate deploy
    depends_on:
      database:
        condition: service_healthy
    env_file: .env.pod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - next-network

  # 3. Next.js Application Service
  next_app:
    build:
      context: .
      target: runner
    container_name: nextjs_app
    restart: always
    depends_on:
      database:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    env_file: .env.pod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - next-network

  # 4. Prisma Studio Service
  prisma-studio:
    image: node:24.15.0-alpine
    container_name: prisma_studio
    working_dir: /app
    volumes:
      - .:/app
    command: npx prisma studio --port 5555 --browser none
    ports:
      - "5555:5555"
    env_file: .env.pod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - next-network
    depends_on:
      database:
        condition: service_healthy

networks:
  next-network:
    name: next-network

volumes:
  postgres_data:
